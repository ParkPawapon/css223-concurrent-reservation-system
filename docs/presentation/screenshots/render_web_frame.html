<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1600px;
    height: 900px;
    background: #090d16;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
    overflow: hidden;
  }
  .window {
    width: 1520px;
    height: 840px;
    background: #0a0e17;
    border-radius: 12px;
    border: 1px solid #1e293b;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .titlebar {
    height: 40px;
    background: #0b1120;
    border-bottom: 1px solid #1e293b;
    display: flex;
    align-items: center;
    padding: 0 16px;
    position: relative;
    flex-shrink: 0;
  }
  .dots {
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
  .dot-red { background: #ff5f56; }
  .dot-yellow { background: #ffbd2e; }
  .dot-green { background: #27c93f; }
  .title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: #94a3b8;
    font-size: 13px;
    font-family: 'JetBrains Mono', Consolas, monospace;
    letter-spacing: 0.5px;
  }
  .badge {
    margin-left: auto;
    color: #64748b;
    font-size: 12px;
    font-family: 'JetBrains Mono', Consolas, monospace;
  }
  .content {
    flex: 1;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: #0a0e17;
  }
  .content img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dots">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
      </div>
      <div class="title">web_visualizer — docs/visualizer/index.html</div>
      <div class="badge">Web · HTML5 · Concurrency Lab</div>
    </div>
    <div class="content">
      <img src="web-visualizer-capture.png" alt="Web Visualizer">
    </div>
  </div>
</body>
</html>
